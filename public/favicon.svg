<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="印章工坊">
  <!-- 朱底圆角方章 -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#b3261e" />
  <!-- 边框（阴刻留白） -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="2.5" fill="none" stroke="#fff" stroke-width="2.2" />
  <!-- 印面两笔：一竖一横，抽象「印」 -->
  <rect x="10.4" y="10.4" width="3" height="11.2" rx="1.5" fill="#fff" />
  <rect x="16.6" y="10.4" width="5" height="3" rx="1.5" fill="#fff" />
  <rect x="16.6" y="15.6" width="5" height="3" rx="1.5" fill="#fff" />
  <rect x="16.6" y="20.6" width="5" height="3" rx="1.5" fill="#fff" />
</svg>
